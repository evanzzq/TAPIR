workspace: workspace.yaml

dataset:
  input_dir: ${paths.downloads_root}/event_sac
  noise_dir: ${paths.downloads_root}/noise_sac
  output_dir: ${paths.real_data_root}/receiver_empirical

processing:
  bandpass: [0.02, 0.5]
  downsample_hz: 5

qc:
  snr_component: UZ
  snr_threshold: 2
  plot_summary: true

empirical_stf:
  interactive: true
  phase: P
  model: ak135
  depth_unit: km  # Set m explicitly for nonstandard SAC depths stored in metres.
  component: Z
  mode: stack
  window: [-2, 5]
  view_window: [-10, 15]
  refine_alignment: false
  max_shift: 1.0
  taper_fraction: 0.1
