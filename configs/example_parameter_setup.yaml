# Self-contained demonstration of Earth receiver-array and Mars workflows.
# For real projects, copy one experiment into its own campaign YAML and update
# data_root, runs_root, sampling settings, and priors for the dataset.

defaults:
  data_root: ../examples/data
  runs_root: ../local/example_runs
  stfshape: "dGaussian"
  is3c: true
  comp: "Z"
  sigma: 0.05
  num_chains: 1
  totalSteps: 20
  burnInSteps: 10
  nSaveModels: 5
  actionsPerStep: 1
  maxN: 2
  man_stf: true
  bandpass: null
  ampRange: [-1.0, 1.0]
  slwRange: [0.0, 2.0]
  minSpace: 0.2
  CDopt: 0
  locDiff: false
  distDiffRange: [-1.0, 1.0]
  bazDiffRange: [-1.0, 1.0]
  fitAtts: false
  # attsRange: [0.0, 4.0]  # t* prior range (s), used when fitAtts is true (3C default (1, 1) fixes t* = 1 s)
  # attsStd: 0.4           # t* proposal step (s); default is a fraction of the range
  fitLoge: false
  fitPhase: false
  normOpt: 1
  isMars: false
  srcArray: false
  pref: 0.0
  fstVp: null
  fstVs: null
  ref_manual: false
  refLat: 0.0
  refLon: 0.0
  refBaz: 0.0

experiments:
  - dataset: "earth_receiver_minimal"
    runname: "smoke_test_combined"

  - dataset: "mars_minimal"
    runname: "smoke_test_combined"
    isMars: true
    srcArray: true
    bandpass: [0.2, 0.8]
