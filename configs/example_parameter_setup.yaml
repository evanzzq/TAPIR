# Self-contained demonstration of Earth receiver-array and Mars workflows.
# For real projects, copy one experiment into its own campaign YAML and update
# data_root, runs_root, sampling settings, and priors for the dataset.

defaults:
  data_root: ../examples/data
  runs_root: ../local/example_runs
  stfshape: "dGaussian"
  is3c: true
  comp: "Z"
  sigma: 0.05
  num_chains: 1
  # max_procs: 4  # concurrent chains; also capped by TAPIR_MAX_WORKERS on HPC
  totalSteps: 20
  burnInSteps: 10
  nSaveModels: 5
  actionsPerStep: 1
  maxN: 2
  # Manual stf.csv: time column + one shared STF or one amplitude column per trace.
  man_stf: true
  # Optional CSV: trace_id,time_shift_s; requires dataset trace_ids.txt.
  # Positive seconds delay every synthetic phase/component for that trace.
  # Paths are relative to this YAML file. Omission/null means zero shifts.
  trace_time_shifts_file: null
  bandpass: null
  ampRange: [-1.0, 1.0]
  slwRange: [0.0, 2.0]
  minSpace: 0.2
  CDopt: 0
  locDiff: false
  distDiffRange: [-1.0, 1.0]
  bazDiffRange: [-1.0, 1.0]
  fitAtts: false
  # For 3C fitAtts runs, explicitly set a nonzero-width range to sample t*.
  # Omission preserves the historical fixed t* = 1 s default; 1C defaults to [0, 4].
  # attsRange: [0.0, 4.0]  # seconds
  # attsStd: 0.4           # seconds; omission derives a step from the range
  # arrStd: 0.15          # seconds
  # slwStd: 0.3           # s/degree
  # ampStd: 0.2
  # aziStd: 5.0           # degrees, 3C only
  # logeStd: 0.2
  # logeRange: [0.0, 6.0]
  fitLoge: false
  fitPhase: false
  normOpt: 1
  isMars: false
  srcArray: false
  pref: 0.0
  fstVp: null
  fstVs: null
  ref_manual: false
  refLat: 0.0
  refLon: 0.0
  refBaz: 0.0

experiments:
  - dataset: "earth_receiver_minimal"
    runname: "smoke_test_combined"

  - dataset: "mars_minimal"
    runname: "smoke_test_combined"
    isMars: true
    srcArray: true
    bandpass: [0.2, 0.8]
